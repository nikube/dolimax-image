name: Build & push dolibarr-demo image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Dolibarr version from Dockerfile FROM tag
        id: version
        run: |
          echo "tag=$(grep -m1 '^FROM' Dockerfile | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nikube/dolibarr-demo:${{ steps.version.outputs.tag }}
            ghcr.io/nikube/dolibarr-demo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/nikube/dolibarr-demo-image
            org.opencontainers.image.description=Dolibarr ${{ steps.version.outputs.tag }} + realistic demo-data installer overlay

  # v24 develop image from nikube/dolibarr@nikubepack (+ DMM pre-bundled).
  # Tagged :latest AND :<dolibarr short sha> — deploy the sha tag to avoid
  # the "overwritten tag not re-pulled" trap (Coolify keeps its local copy).
  nikubepack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone sources
        run: |
          git clone --depth 1 -b nikubepack https://github.com/nikube/dolibarr.git src/dolibarr
          git clone --depth 1 https://github.com/nikube/DMM.git src/DMM

      - name: Source revision
        id: rev
        run: |
          echo "sha=$(git -C src/dolibarr rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nikubepack
          push: true
          tags: |
            ghcr.io/nikube/dolibarr-nikubepack:${{ steps.rev.outputs.sha }}
            ghcr.io/nikube/dolibarr-nikubepack:latest
          labels: |
            org.opencontainers.image.source=https://github.com/nikube/dolibarr-demo-image
            org.opencontainers.image.description=Dolibarr v24 develop (nikubepack branch) + DMM
