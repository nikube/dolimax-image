name: Build & push dolimax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nikube/dolimax

jobs:
  # One image per Dolibarr git tag (sources from git, runtime from the official
  # image). Extra tags: major (:23) and :latest on the newest stable of the matrix.
  # :develop is the head of a branch (nikube/dolibarr@nikubepack), built from the
  # resolved sha so the tag and the content cannot drift apart, and also tagged
  # :develop-<short sha> — deploy that one to avoid the "overwritten tag not
  # re-pulled" trap.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["21.0.4", "22.0.5", "23.0.4", "24.0.3"]
        include:
          - version: "24.0.3"
            latest: true
          - version: develop
            repo: nikube/dolibarr
            branch: nikubepack
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Source ref and tags
        id: src
        run: |
          v=${{ matrix.version }}
          repo=${{ matrix.repo || 'Dolibarr/dolibarr' }}
          ref=$v
          t="$IMAGE:$v"
          if [ -n "${{ matrix.branch }}" ]; then
            ref=$(git ls-remote "https://github.com/$repo.git" "refs/heads/${{ matrix.branch }}" | cut -f1)
            [ -n "$ref" ]
            t="$t,$IMAGE:$v-${ref:0:7}"
          else
            t="$t,$IMAGE:${v%%.*}"
          fi
          if [ "${{ matrix.latest }}" = "true" ]; then t="$t,$IMAGE:latest"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tags=$t" >> "$GITHUB_OUTPUT"
      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            DOLI_REPO=${{ steps.src.outputs.repo }}
            DOLI_REF=${{ steps.src.outputs.ref }}
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}
      - name: Smoke test — boot, realistic demo, DMM installs + activation
        run: |
          DOLIMAX_TAG=${{ matrix.version }} docker compose up -d
          for i in $(seq 1 120); do
            log=$(docker compose logs dolibarr 2>&1)
            echo "$log" | grep -q "CRON_KEY stored" && break
            echo "$log" | grep -q "\[dolimax\] ERROR" && { echo "$log" | tail -50; docker compose exec -T dolibarr sh -c 'tail -50 /var/www/documents/*.log'; exit 1; }
            sleep 10
          done
          echo "$log" | grep "\[dolimax\]"
          echo "$log" | grep -q "demo data generated successfully" || { docker compose exec -T dolibarr sh -c 'tail -50 /var/www/documents/*.log'; exit 1; }
          echo "$log" | grep -q "extra modules installed" || { docker compose exec -T dolibarr sh -c 'tail -50 /var/www/documents/dmm-install.log'; exit 1; }
          docker compose exec -T dolibarr sh -c 'cat /var/www/documents/dmm-install.log'
          docker compose down -v
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            DOLI_REPO=${{ steps.src.outputs.repo }}
            DOLI_REF=${{ steps.src.outputs.ref }}
          push: true
          tags: ${{ steps.src.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikube/dolimax-image
            org.opencontainers.image.description=Dolibarr ${{ matrix.version }} + realistic demo generator + DOLI_EXTRA_MODULES / DOLI_ACTIVATE_MODULES
