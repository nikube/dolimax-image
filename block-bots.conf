SetEnvIfNoCase User-Agent "(meta-externalagent|facebookexternalhit|GPTBot|ClaudeBot|CCBot|Bytespider|Amazonbot|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot)" bad_bot
<Location "/">
  <RequireAll>
    Require all granted
    Require not env bad_bot
  </RequireAll>
</Location>
<IfModule mod_headers.c>
  Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>
